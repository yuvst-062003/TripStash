[project]
name = "tripstash-api"
version = "0.1.0"
description = "TripStash API - personal travel memory and decision layer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
    "httpx>=0.27",
    "email-validator>=2.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
ai = ["anthropic>=1.0"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# The seed is a data table: long Hebrew sentences and photo URLs stay on one line.
"app/seed.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["app*"]
