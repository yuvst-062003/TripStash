<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3faf6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1c1f" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Save places from anywhere, see them around you, and bring them back when the moment is right."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Self-hosted so typography survives offline, and preloaded so the first
         paint is not a system-font flash. -->
    <link rel="preload" href="/fonts/BricolageGrotesque-var.woff2" as="font" type="font/woff2" crossorigin />

    <title>TripStash</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Rubber-stamp ink: a little turbulence on the stamp edges. Referenced
         by the large stamps only, so lists stay cheap to paint. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <filter id="ink" x="-6%" y="-6%" width="112%" height="112%">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
