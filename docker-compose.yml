# Local stack. `docker compose up` gives Postgres + PostGIS, the API and the PWA.
# The API also runs without any of this (SQLite + fake providers) - see README.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: tripstash
      POSTGRES_PASSWORD: tripstash
      POSTGRES_DB: tripstash
    ports: ['5432:5432']
    volumes:
      - tripstash-db:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tripstash -d tripstash']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      TRIPSTASH_DATABASE_URL: postgresql+psycopg://tripstash:tripstash@db:5432/tripstash
      # No fallback on purpose. The development default is a literal in this
      # repository, so falling back to it would publish a signing key. Compose
      # refuses to start rather than quietly using it.
      TRIPSTASH_SECRET_KEY: ${TRIPSTASH_SECRET_KEY:?run ./setup.sh first, or set it yourself}
      TRIPSTASH_ENVIRONMENT: production
      TRIPSTASH_STORAGE_DIR: /data/storage
      # nginx serves the web app and proxies /api to this service, so the
      # browser only ever sees one origin and CORS never comes into it.
      TRIPSTASH_CORS_ORIGINS: '[]'
    volumes:
      - tripstash-files:/data/storage
    # Deliberately not published to the host: the only way in is through the
    # web container, which is the thing with a certificate in front of it.
    expose: ['8000']
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    environment:
      TRIPSTASH_API_ORIGIN: http://api:8000
    ports: ['5173:80']
    depends_on: [api]

volumes:
  tripstash-db:
  tripstash-files:
